[package]
name = "control-plane-desktop"
version = "0.1.0"
description = "App de escritorio de control-plane: envuelve el server local en una ventana propia."
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "control_plane_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri-plugin-autostart = "2.5.1"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.53.1", features = ["time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.9"
