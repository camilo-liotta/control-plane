[package]
name = "control-plane-desktop"
version = "0.9.0"
description = "App de escritorio de control-plane: envuelve el server local en una ventana propia."
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "control_plane_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.53.1", features = ["time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# RNG del sistema para el token de la pantalla local (en unix se lee /dev/urandom).
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-autostart = "2.5.1"
mac-notification-sys = "0.6.9"
block2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
