[package]
name = "control-plane-desktop"
version = "0.1.0"
description = "App de escritorio de control-plane: envuelve el server local en una ventana propia."
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "control_plane_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
